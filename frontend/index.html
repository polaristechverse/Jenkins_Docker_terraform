<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps E-Commerce Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #232f3e;
  color: white;
  padding: 18px 40px;
  font-size: 22px;
}

.hero {
  background: #ff9900;
  color: white;
  padding: 60px;
  text-align: center;
}

.products {
  display: flex;
  gap: 25px;
  padding: 40px;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  background: white;
  width: 260px;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 0 15px #ccc;
  text-align: center;
}

.card img {
  width: 100%;
  height: 200px;         
  object-fit: contain;   
  background: #fff;     
  padding: 10px;         
}

.price {
  font-weight: bold;
  margin: 10px 0;
}

button {
  background: #ff9900;
  border: none;
  padding: 10px 16px;
  cursor: pointer;
}

.cart {
  background: white;
  margin: 20px 40px;
  padding: 20px;
}

.total {
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>DevOps E-Commerce Store</header>

<section class="hero">
  <h1>Shop Smart</h1>
  <p>Powered by Spring Boot, Docker & Jenkins</p>
</section>

<section class="products" id="productList">
  Loading products...
</section>

<section class="cart">
  <h2>Cart</h2>
  <ul id="cartItems"></ul>
  <div class="total">Total: Rs <span id="total">0</span></div>
  <button onclick="checkout()">Checkout</button>
</section>

<script>
let cart = [];
let total = 0;

fetch("/api/products")
  .then(res => res.json())
  .then(products => {
    const container = document.getElementById("productList");
    container.innerHTML = "";

    products.forEach(p => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <img src="images/${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="price">Rs ${p.price}</p>
        <button onclick='addToCart(${JSON.stringify(p)})'>
          Add to Cart
        </button>
      `;
      container.appendChild(div);
    });
  });

function addToCart(product) {
  cart.push(product);
  total += product.price;

  const li = document.createElement("li");
  li.innerText = `${product.name} - Rs ${product.price}`;
  document.getElementById("cartItems").appendChild(li);

  document.getElementById("total").innerText = total;
  localStorage.setItem("cart", JSON.stringify(cart));
  localStorage.setItem("total", total);
}

function checkout() {
  fetch("/api/inventory")
    .then(res => res.text())
    .then(data => {
      if (data.includes("YES")) {
        window.location.href = "summary.html";
      }
    });
}
</script>

</body>
</html>
